openapi: "3.1.0"
info:
  version: 1.0.0
  title: Swagger Petstore
  license:
    name: MIT
  description: >-
    Adapted from the canonical OpenAPI Initiative "Petstore" example. Every
    Schema Object in this document is a JSON Structure schema: the document
    declares the JSON Structure Core meta-schema as its default dialect via
    `jsonSchemaDialect`, so no individual Schema Object needs its own
    `$schema`.
jsonSchemaDialect: https://json-structure.org/meta/core/v0/#
servers:
  - url: http://petstore.swagger.io/v1
paths:
  /pets:
    get:
      summary: List all pets
      operationId: listPets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: How many items to return at one time (max 100)
          required: false
          schema:
            type: int32
      responses:
        "200":
          description: A paged array of pets
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pets"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Create a pet
      operationId: createPets
      tags:
        - pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              name: NewPet
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                tag:
                  type: string
      responses:
        "201":
          description: Null response
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /pets/{petId}:
    get:
      summary: Info for a specific pet
      operationId: showPetById
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          description: The id of the pet to retrieve
          schema:
            type: string
      responses:
        "200":
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Pet:
      name: Pet
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: int64
        name:
          type: string
        tag:
          type: string
    Pets:
      name: Pets
      type: array
      items:
        type:
          $ref: "#/definitions/Pet"
      definitions:
        Pet:
          name: Pet
          type: object
          required:
            - id
            - name
          properties:
            id:
              type: int64
            name:
              type: string
            tag:
              type: string
    Error:
      name: Error
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: int32
        message:
          type: string
