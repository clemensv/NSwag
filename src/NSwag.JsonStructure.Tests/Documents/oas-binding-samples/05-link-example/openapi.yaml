openapi: "3.1.0"
info:
  title: Link Example
  version: "1.0.0"
  description: >-
    Adapted from the OpenAPI Initiative's "Link Example" (a GitHub-Bitbucket
    style user/repository API). OAS Link Objects are an OAS-level feature and
    are untouched by this binding; this document shows them working
    unmodified alongside JSON Structure Schema Objects, including the core
    `uuid` type.
jsonSchemaDialect: https://json-structure.org/meta/core/v0/#
paths:
  /2.0/users/{username}:
    get:
      operationId: getUserByName
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          links:
            userRepositories:
              operationId: getRepositoriesByOwner
              parameters:
                username: "$response.body#/username"
  /2.0/repositories/{username}:
    get:
      operationId: getRepositoriesByOwner
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: repositories owned by the supplied user
          content:
            application/json:
              schema:
                name: RepositoryList
                type: array
                items:
                  type:
                    $ref: "#/definitions/Repository"
                definitions:
                  User:
                    name: User
                    type: object
                    required:
                      - id
                      - username
                    properties:
                      id:
                        type: uuid
                      username:
                        type: string
                  Repository:
                    name: Repository
                    type: object
                    required:
                      - slug
                      - owner
                    properties:
                      slug:
                        type: string
                      description:
                        type: string
                      private:
                        type: boolean
                      owner:
                        type:
                          $ref: "#/definitions/User"
          links:
            repository:
              operationId: getRepository
              parameters:
                username: "$response.body#/0/owner/username"
                slug: "$response.body#/0/slug"
  /2.0/repositories/{username}/{slug}:
    get:
      operationId: getRepository
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The repository
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repository"
components:
  schemas:
    User:
      name: User
      type: object
      required:
        - id
        - username
      properties:
        id:
          type: uuid
        username:
          type: string
    Repository:
      name: Repository
      type: object
      required:
        - slug
        - owner
      properties:
        slug:
          type: string
        description:
          type: string
        private:
          type: boolean
        owner:
          type:
            $ref: "#/definitions/User"
      definitions:
        User:
          name: User
          type: object
          required:
            - id
            - username
          properties:
            id:
              type: uuid
            username:
              type: string
